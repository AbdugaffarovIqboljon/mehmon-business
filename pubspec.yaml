name: mehmon
description: "MEHMON – Restaurant Staff Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  fl_chart: ^1.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.4
  go_router: ^14.8.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.6.1
  sentry_flutter: ^8.13.0
  shared_preferences: ^2.5.4
  syncfusion_flutter_calendar: ^28.2.5

dev_dependencies:
  build_runner: ^2.4.14
  flutter_native_splash: ^2.4.4
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  very_good_analysis: ^7.0.0

flutter:
  generate: true
  uses-material-design: true


  assets:
    - assets/images/
    - assets/icons/

flutter_native_splash:
  color: "#FFF6EC"
  image: "assets/images/img_app_logo.png"
